name: Release stuck Phase 03.2 test run
on:
  pull_request:
    types: [synchronize]
permissions:
  actions: write
jobs:
  cancel-specific-stuck-run:
    if: github.repository == 'rahadul231/YouPlayerTube' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/phase-03-2-persistence'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Force-cancel only run 13
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS=$(gh api repos/rahadul231/YouPlayerTube/actions/runs/43311158626 --jq .status)
          if [ "$STATUS" != completed ]; then
            gh api --method POST repos/rahadul231/YouPlayerTube/actions/runs/43311158626/force-cancel
          fi
