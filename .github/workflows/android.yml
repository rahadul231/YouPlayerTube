name: Android debug build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    # Pinned: ubuntu-latest is migrating from 24.04 to 26.04 (Oct 19 - Nov 19, 2026).
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Show environment (diagnostic)
        run: |
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          ls "${ANDROID_HOME:-/nonexistent}" || true
          echo "--- platforms ---"
          ls "${ANDROID_HOME:-/nonexistent}/platforms" || true
          echo "--- build-tools ---"
          ls "${ANDROID_HOME:-/nonexistent}/build-tools" || true
          echo "--- cmdline-tools ---"
          ls "${ANDROID_HOME:-/nonexistent}/cmdline-tools" || true

      - name: Install Android platform 37 and build-tools 36.0.0 (best effort)
        continue-on-error: true
        run: |
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(command -v sdkmanager || true)"; fi
          echo "sdkmanager: ${SDKM:-not found}"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Inspect APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          sha256sum "$APK"
          AAPT2="$(find "${ANDROID_HOME}/build-tools" -name aapt2 2>/dev/null | sort | tail -1)"
          echo "aapt2: ${AAPT2:-not found}"
          if [ -n "$AAPT2" ]; then
            "$AAPT2" dump badging "$APK" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^application-label:" || true
          fi

      - name: Upload debug APK (unzipped single file)
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
